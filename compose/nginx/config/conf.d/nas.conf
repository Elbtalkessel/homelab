# nas.home.arpa/
upstream nas.s1.home.arpa {
    server 192.168.1.90:8000;
    keepalive 2;
}
server {
    server_name nas.s1.home.arpa;
    access_log /var/log/nginx/access.log vhost;
    http2 on;
    listen 443 ssl ;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_certificate /etc/nginx/certs/s1.home.arpa.crt;
    ssl_certificate_key /etc/nginx/certs/s1.home.arpa.key;
    set $sts_header "";
    if ($https) {
        set $sts_header "max-age=31536000";
    }
    add_header Strict-Transport-Security $sts_header always;
    include /etc/nginx/vhost.d/default;
    location / {
        proxy_pass http://nas.s1.home.arpa;
        set $upstream_keepalive true;
    }
}
