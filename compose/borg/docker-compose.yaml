---
# https://github.com/borgmatic-collective/docker-borgmatic
name: borgmatic

services:
  borgmatic:
    image: ghcr.io/borgmatic-collective/borgmatic
    container_name: borgmatic
    hostname: moon
    environment:
      - TZ=Etc/UTC
      - BORG_PASSPHRASE=${BORG_PASSPHRASE}
      - BACKUP_CRON=0 0 * * *
      - DOCKERCLI=true
    env_file: ./borgmatic.env
    volumes:
      # backup source
      - /share:/mnt/share:ro
      - /volume1/.@plugins/AppCentral/docker-ce/docker_lib/volumes:/mnt/docker-volumes:ro
      # backup target
      - /share/USB4:/mnt/borg-repository
      # preview
      - /mnt/borg/preview:/mnt/preview
      # borgmatic config file(s) + crontab.txt
      - ./data/borgmatic.d:/etc/borgmatic.d/
      # config and keyfiles
      - ./data/.config:/root/.config/borg
      # ssh key for remote repositories
      - ./data/.ssh:/root/.ssh
      # checksums used for deduplication
      - ./data/.cache:/root/.cache/borg
    networks:
      - immich-database
      - postgres
      - borg

  borgwarehouse:
    container_name: borgwarehouse
    image: borgwarehouse/borgwarehouse
    user: "1000:1000"
    ports:
      - 2222:2222
    environment:
      - VIRTUAL_HOST=borg.s1.home.arpa
      - VIRTUAL_PORT=3000
    env_file: ./borgwarehouse.env
    volumes:
      - /share/USB4:/home/borgwarehouse/repos
      - ./data/.config:/home/borgwarehouse/app/config
      - ./data/.ssh:/home/borgwarehouse/.ssh
      - ./data/ssh_host:/etc/ssh
      - ./data/tmp:/home/borgwarehouse/tmp
      - ./data/logs:/home/borgwarehouse/logs
    networks:
      - public
      - borg

networks:
  immich-database:
    external: true
  postgres:
    external: true
  public:
    external: true
  borg:
