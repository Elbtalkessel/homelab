---
source_directories:
  - /mnt/share
  - /mnt/docker-volumes
repositories:
  #- path: /mnt/borg-repository/repo
  - ssh://borgwarehouse:22/./
one_file_system: false

#   Passphase is set in varibable $BORG_PASSPHRASE
#   encryption_passphrase: "DoNotForgetToChangeYourPassphrase"
compression: lz4
archive_name_format: "backup-{now}"

keep_hourly: 2
keep_daily: 7
keep_weekly: 4
keep_monthly: 12
keep_yearly: 10

checks:
  - name: repository
    frequency: 2 weeks
  - name: archives
    frequency: always
  - name: extract
    frequency: 2 weeks
  - name: data
    frequency: 1 month

patterns:
  # Exclude usb device mounts (including repo).
  - "- sh:/mnt/share/USB*"
  # Don't backup the Downloads directory (files from here are hardlinked anyway)
  - "- sh:/mnt/share/Video/Downloads"
  # Exclude know db data.
  - "- sh:/mnt/share/Docker/PostgreSQL"
  - "- sh:/mnt/share/Docker/Immich/postgresql"
  # Exclude anonymous docker volumes
  - "- re:^\/mnt\/docker-volumes\/.{64}/?$"
  # Known offenders, the regex above should filter it out,
  # but "just in case" bacase borgmatic complains about it.
  - "- sh:/mnt/docker-volumes/backingFsBlockDev"

# https://torsion.org/borgmatic/docs/how-to/backup-your-databases/
postgresql_databases:
  - name: bewcloud
    hostname: postgres
    username: risus
    password: right.tree.part.bottle
