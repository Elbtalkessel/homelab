---
name: bewcloud

services:
  bewcloud:
    image: ghcr.io/bewcloud/bewcloud:v2.5.3
    container_name: bewcloud
    restart: always
    mem_limit: "256m"
    environment:
      - VIRTUAL_HOST=docs.s1.home.arpa
      - VIRTUAL_PORT=8000
    env_file:
      - path: .env
        required: true
    volumes:
      - bewcloud:/app/data-files
      - ./bewcloud.config.ts:/app/bewcloud.config.ts
    networks:
      - public
      - postgres

  # CardDav/CalDav server.
  radicale:
    image: tomsquest/docker-radicale:3.5.4.0
    container_name: radicale
    environment:
      - VIRTUAL_HOST=dav.s1.home.arpa
      - VIRTUAL_PORT=5232
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    restart: always
    volumes:
      - radicale:/data
      - ./radicale-config:/config:ro
    mem_limit: "256m"
    networks:
      - public

networks:
  public:
    external: true
  postgres:
    external: true

volumes:
  bewcloud:
    driver: local
  radicale:
    driver: local
