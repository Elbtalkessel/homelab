---
name: gitea
services:
  server:
    image: docker.gitea.com/gitea:latest
    container_name: gitea
    restart: unless-stopped
    volumes:
      - gitea:/data
      - /home/git/.ssh/:/data/git/.ssh
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - VIRTUAL_HOST=gitea.s1.home.arpa
      - VIRTUAL_PORT=3000
      - ALLOW_LOCALNETWORKS=true
      - USER_UID=1002
      - USER_GID=100
    env_file: ./gitea.env
    ports:
      - "127.0.0.1:2201:22"
    networks:
      - public
      - postgres

networks:
  public:
    external: true
  postgres:
    external: true

volumes:
  gitea:
    driver: local
