---
variant: fcos
version: 1.6.0

passwd:
  users:
    - name: risus
      home_dir: /var/home/risus
      shell: /bin/bash
      ssh_authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC7ulI5D34Y49wPgraM2iHLJHYzKBlJaB1akgibNJR1y risus@omen
      groups:
        - wheel
        - sudo
        - docker

storage:
  files:
    - path: /etc/hostname
      mode: 0644
      contents:
        inline: coreos

    - path: /etc/hosts
      mode: 0644
      contents:
        inline: |
          127.0.0.1     localhost localhost.localdomain localhost4 localhost4.localdomain4
          ::1           localhost localhost.localdomain localhost6 localhost6.localdomain6
          s1.home.apra  192.168.8.91

    - path: /etc/zincati/config.d/90-disable-auto-updates.toml
      mode: 0644
      contents:
        inline: |
          [updates]
          enabled = false

    - path: /etc/systemd/system/rpm-ostree-countme.timer.d/40-weekly.conf
      mode: 0644
      contents:
        inline: |
          [Timer]
          OnCalendar=weekly

    - path: /etc/cockpit/cockpit.conf
      mode: 0644
      contents:
        inline: |
          [WebService]
          Origins = https://cockpit.x.home.arpa wss://cockpit.x.home.arpa
          ProtocolHeader = X-Forwarded-Proto
          ForwardedForHeader = X-Forwarded-For
          AllowUnencrypted = true
          ClientCertAuthentication = false

  trees:
    - local: stacks
      path: /var/home/risus/homelab/stacks

  directories:
    - path: /mnt/s1
      mode: 0700

  disks:
    - device: /dev/sdb
      wipe_table: false
      partitions:
        - number: 1
          label: var

  filesystems:
    - path: /var
      device: /dev/disk/by-partlabel/var
      format: ext4
      label: var
      wipe_filesystem: false
      with_mount_unit: true
      mount_options:
        - discard
        - noatime
        - nodiratime
        - commit=60

systemd:
  units:
    - name: rpm-ostree-rebase-to-ucore.service
      enabled: true
      contents: |
        [Unit]
        Description=Rebase to uCore
        Wants=network-online.target
        After=network-online.target
        Before=zincati.service
        ConditionPathExists=!/var/lib/rpm-ostree-rebase-to-ucore.stamp

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/usr/bin/rpm-ostree rebase --reboot ostree-unverified-registry:ghcr.io/ublue-os/ucore:stable
        ExecStart=/usr/bin/touch /var/lib/rpm-ostree-rebase-to-ucore.stamp

        [Install]
        WantedBy=multi-user.target

    - name: docker.socket
      enabled: false
      contents: |
        [Unit]
        Description=Docker Socket for the API
        PartOf=docker.service

        [Socket]
        ListenStream=/run/docker.sock
        SocketMode=0660
        SocketUser=root
        SocketGroup=docker

        [Install]
        WantedBy=sockets.target

    - name: s1-media.mount
      enabled: true
      contents: |
        [Unit]
        After=network.target

        [Mount]
        What=s1.home.arpa:/volume1/Video
        Where=/mnt/s1/media
        Type=nfs
        Options=_netdev,auto,vers=4

        [Install]
        WantedBy=podman.service

    - name: s1-whatever.mount
      enabled: true
      contents: |
        [Unit]
        After=network.target

        [Mount]
        What=s1.home.arpa:/volume1/Whatever
        Where=/mnt/s1/whatever
        Type=nfs
        Options=_netdev,auto,vers=4

        [Install]
        WantedBy=podman.service
