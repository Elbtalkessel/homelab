general:
  contact_url: false
  debug: false
  donation_url: false
  enable_metrics: true
  instance_name: SearXNG Instance
  privacypolicy_url: false

outgoing:
  enable_http2: true
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 15
  request_timeout: 5.0

search:
  autocomplete: duckduckgo
  autocomplete_min: 2
  formats:
    - html
    - json
    - csv
    - rss
  safe_search: 0

server:
  base_url: https://search.x.home.arpa
  bind_address: 127.0.0.1
  image_proxy: true
  limiter: false
  method: GET
  port: 9081
  public_instance: false
  secret_key: /run/secrets/searx

ui:
  center_alignment: true
  default_locale: en
  default_theme: simple
  hotkeys: vim
  infinite_scroll: false
  query_in_title: true
  search_on_category_select: false
  static_use_hash: true
  theme_args:
    simple_style: auto

use_default_settings: true

valkey:
  url: unix:///run/redis-searx/redis.sock
