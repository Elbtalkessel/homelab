model_list:
  - model_name: qwen3-8b-amd
    litellm_params:
      model: bazzite.lan/qwen3-8b
  - model_name: qwen3-8b-nvidia
    litellm_params:
      model: omen.lan/qwen3-8b
  - model_name: free-default
    litellm_params:
      model: opencodego/longcat-2.5-preview-free
      drop_params: true
  - model_name: omo-max-code
    litellm_params:
      model: opencodego/deepseek-v4-pro
      drop_params: true
  - model_name: omo-max-reasoning
    litellm_params:
      model: opencodego/kimi-k3
      drop_params: true
  - model_name: omo-free-router
    litellm_params:
      model: auto_router/complexity_router
      drop_params: true
      complexity_router_config:
        classifier_type: heuristic
        tiers:
          SIMPLE: free-default
          MEDIUM: free-default
          COMPLEX: free-default
          REASONING: free-default
        dimension_weights:
          tokenCount: 0.0
          reasoningMarkers: 0.4
          simpleIndicators: 0.2
          technicalTerms: 0.25
          codePresence: 0.1
          multiStepPatterns: 0.03
          questionComplexity: 0.02
        tier_boundaries:
          simple_medium: 0.1
          medium_complex: 0.25
          complex_reasoning: 0.55
        session_affinity: false
        return_raw_model_name: false
      complexity_router_default_model: free-default
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 5
  cooldown_time: 10
  routing_groups:
    - group_name: qwen3-8b
      models:
        - qwen3-8b-amd
        - qwen3-8b-nvidia
      routing_strategy: simple-shuffle
    - group_name: omo-vision
      models:
        - free-default
      routing_strategy: simple-shuffle
      #fallbacks:
      #  - local-qwen3-8b:
      #      - free-default
      #  - omo-max-code:
      #      - free-default
      #  - omo-max-reasoning:
      #      - free-default
general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  health_check_skip_disabled_background_models: true
  telemetry: false
  disable_env_credential_login: true
  store_prompts_in_spend_logs: true
  forward_client_headers_to_llm_api: true
litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379
  # Forward unknown params to the upstream provider instead of erroring.
  drop_params: true
  # Persist successful requests only -- keeps the spend tracking table clean.
  set_verbose: true
