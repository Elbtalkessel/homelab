# vim: set filetype=go :

{{$proxies := list
  (dict "Service" "calibre"
        "Enable" true
        "Port" 8083)

  (dict "Service" "filebot"
        "Enable" false
        "Port" 5452)

  (dict "Service" "gitea"
        "Enable" true
        "Port" 3000)

  (dict "Service" "immich"
        "Enable" true
        "Alias" "photos"
        "Port" 2283)

  (dict "Service" "stash"
        "AllowHomeCors" true
        "Enable" true
        "Port" 9999)

  (dict "Service" "stash-ai"
        "Enable" true
        "Port" 4153)

  (dict "Service" "vaultwarden"
        "Enable" true
        "Alias" "vault"
        "Port" 80)

  (dict "Service" "lidarr"
        "Enable" true
        "Port" 8686)

  (dict "Service" "seerr"
        "Enable" true
        "Port" 5055)

  (dict "Service" "prowlarr"
        "Enable" true
        "Port" 9696)

  (dict "Service" "radarr"
        "Enable" true
        "Port" 7878)

  (dict "Service" "sonarr"
        "Enable" true
        "Port" 8989)

  (dict "Service" "torrent"
        "Enable" true
        "Port" 8080)

  (dict "Service" "invidious"
        "Enable" true
        "Alias" "yt"
        "Port" 3000)

  (dict "Service" "notifiarr"
        "Enable" false
        "Port" 5454)

  (dict "Service" "adguard"
        "Enable" true
        "Port" 80)

  (dict "Service" "whoami"
        "Enable" true
        "Port" 80)

  (dict "Service" "i2pd"
        "Enable" false
        "Port" 7070)

  (dict "Service" "romm"
        "Enable" true
        "Port" 8080)

  (dict "Service" "roundcube"
        "Enable" true
        "Alias" "mail"
        "Port" 8080)

  (dict "Service" "stasharr"
        "Enable" true
        "Port" 3000)

  (dict "Service" "uptime-kuma"
        "Alias" "status"
        "Enable" true
        "Port" 3001)

  (dict "Service" "binge"
        "AllowHomeCors" true
        "Enable" true
        "Port" 7878)

  (dict "Service" "cove"
        "Enable" true
        "Port" 5073)

  (dict "Service" "bifrost"
        "Enable" false
        "Port" 8080)

  (dict "Service" "voidllm"
        "Enable" false
        "Port" 8080)

  (dict "Service" "litellm"
				"Alias" "ai"
        "Enable" true
        "Port" 4000)
}}

http:
  middlewares:
    allowhome:
      headers:
        accessControlAllowCredentials: true
        accessControlAllowOriginList:
          - "https://omen.home.arpa"
          - "https://binge.x.home.arpa"
          - "https://stash.x.home.arpa"
        accessControlAllowMethods:
          - GET
          - POST
          - OPTIONS
          - HEAD
          - PATCH
          - PUT
          - DELETE
        accessControlAllowHeaders:
          - User-Agent
          - Authorization
          - Content-Type
          - apikey
  {{range $proxies}}
  {{if .Enable}}
  {{if .SuspendAfter }}
    {{.Service}}-sablier:
      plugin:
        sablier:
          {{if .Blocking}}
          blocking:
            defaultTimeout: 10s
          {{else}}
          dynamic:
            displayName: {{.Service}}
            refreshFrequency: 5s
            showDetails: true
            theme: shuffle
          {{end}}
          sablierUrl: http://sablier:10000
          sessionDuration: {{.SuspendAfter}}
          names: {{or .Names .Service}}
  {{end}}
  {{end}}
  {{end}}

  services:
  {{range $proxies}}
    {{if .Enable}}
    {{.Service}}:
      loadBalancer:
        {{if .HostNetwork}}
        passHostHeader: true
        {{end}}
        servers:
          {{if .HostNetwork}}
          - url: http://host.containers.internal:{{.Port}}
          {{else}}
          - url: http://{{.Service}}:{{.Port}}
          {{end}}
    {{end}}
  {{end}}

  routers:
  {{range $proxies}}
    {{if .Enable}}
    {{.Service}}:
      {{$domain := or .Alias .Service}}
      rule: "Host(`{{$domain}}.x.home.arpa`)"
      entryPoints:
        - websecure
      {{if .SuspendAfter}}
      middlewares:
        - {{.Service}}-sablier@file
      {{end}}
      {{if .AllowHomeCors}}
      middlewares:
        - allowhome
      {{end}}
      service: {{.Service}}
      tls:
        certresolver: ca
    {{end}}
  {{end}}
