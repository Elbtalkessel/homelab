---
- name: Ensure local bin directory
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory

- name: Copy wakeup-machines script
  ansible.builtin.template:
    src: wakeup-machines.sh.j2
    dest: /usr/local/bin/wakeup-machines.sh
    mode: "0744"

- name: Copy wakeup-machines systemd service
  ansible.builtin.copy:
    src: files/etc/systemd/system/wakeup-machines.service
    dest: /etc/systemd/system/

- name: Copy wakeup-machines systemd timer
  ansible.builtin.copy:
    src: files/etc/systemd/system/wakeup-machines.timer
    dest: /etc/systemd/system/

- name: Start wakeup-machines timer
  ansible.builtin.systemd_service:
    name: wakeup-machines.timer
    state: started
    enabled: true
    daemon_reload: true
