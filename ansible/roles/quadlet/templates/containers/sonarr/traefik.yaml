[%- from '_sablier.yaml.j2' import sablier_middleware -%]
http:
  middlewares:
[[ sablier_middleware(service) | indent(4, true) ]]
  services:
    sonarr:
      loadBalancer:
        servers:
          - url: http://sonarr:8989
  routers:
    sonarr:
      rule: "Host(`sonarr.x.home.arpa`)"
      middlewares:
        - sonarr-sablier@file
      service: sonarr
