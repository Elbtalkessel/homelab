[%- from '_sablier.yaml.j2' import sablier_middleware -%]
http:
  middlewares:
[[ sablier_middleware(service) | indent(4, true) ]]
  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://whoami:80
  routers:
    whoami:
      rule: "Host(`whoami.x.home.arpa`)"
      middlewares:
        - whoami-sablier@file
      service: whoami
