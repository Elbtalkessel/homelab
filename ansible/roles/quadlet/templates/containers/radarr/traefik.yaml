[%- from '_sablier.yaml.j2' import sablier_middleware -%]
http:
  middlewares:
[[ sablier_middleware(service) | indent(4, true) ]]
  services:
    radarr:
      loadBalancer:
        servers:
          - url: http://radarr:7878
  routers:
    radarr:
      rule: "Host(`radarr.x.home.arpa`)"
      middlewares:
        - radarr-sablier@file
      service: radarr
