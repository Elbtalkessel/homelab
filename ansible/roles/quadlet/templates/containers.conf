# In case when DNS from DHCP is ignored and set
# using `nmcli c m <conn> ipv4.dns "192.168.1.130"
# podman containers are not able to resolve local services by fqdn (ex. foo.x.home.arpa.)
# I guess I need to modify podman0 connection, but too afraid too mess it up :)

[containers]
dns_servers = ["192.168.1.130", "9.9.9.9"]
