---
- name: Resolve files to sync
  ansible.builtin.set_fact:
    quadlet_files: >-
      {{
        lookup('community.general.filetree', role_path ~ '/templates/containers', wantlist=true)
        | selectattr('state', 'eq', 'file')
        | selectattr('path', 'match', '^((' ~ (containers | join('|')) ~ ')/|public\.network$)')
      }}

- name: Resolve proxied services
  ansible.builtin.set_fact:
    quadlet_proxied_services: >-
      {{
        quadlet_files
        | selectattr('path', 'match', '^[^/]+/traefik\.yaml$')
        | map(attribute='path')
        | map('replace', '/traefik.yaml', '')
        | list
      }}

- name: Create staging directory
  ansible.builtin.tempfile:
    state: directory
    prefix: quadlet-stage-
  register: quadlet_tmp_stage
  delegate_to: localhost
  changed_when: false
  check_mode: false # must run and return a real path

- name: Stage and push quadlet tree
  block:
    - name: Render quadlet tree
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path ~ '/../../scripts/render.py' }}"
        stdin: >-
          {{
            {
               'dest': quadlet_tmp_stage.path,
               'library_roots': [role_path ~ '/templates/containers'],
               'files': quadlet_files | map(attribute='path') | list,
               'opts': {
                 'block_start_string': '[%',
                 'block_end_string': '%]',
                 'variable_start_string': '[[',
                 'variable_end_string': ']]'
               },
               'context': {
                 'containers': containers,
               }
             } | to_json
          }}
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Ensure traefik conf.d exists in staging
      ansible.builtin.file:
        path: "{{ quadlet_tmp_stage.path }}/traefik/etc/conf.d"
        state: directory
        mode: "0755"
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Collect traefik routes into traefik conf.d
      ansible.builtin.copy:
        src: "{{ quadlet_tmp_stage.path }}/{{ item }}/traefik.yaml"
        dest: "{{ quadlet_tmp_stage.path }}/traefik/etc/conf.d/{{ item }}.yaml"
        remote_src: true
        mode: "0644"
      loop: "{{ quadlet_proxied_services }}"
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Remove per-service traefik route files
      ansible.builtin.file:
        path: "{{ quadlet_tmp_stage.path }}/{{ item }}/traefik.yaml"
        state: absent
      loop: "{{ quadlet_proxied_services }}"
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Push quadlet tree
      ansible.posix.synchronize:
        src: "{{ quadlet_tmp_stage.path }}/"
        dest: "{{ dst_containers_dir }}/systemd/"
        delete: true
        recursive: true
        rsync_opts:
          - "--checksum"
          - "--itemize-changes"
      register: quadlet_push_result
      changed_when: >-
        quadlet_push_result.stdout_lines | select('match', '(^>f|\*deleting)') | list | length > 0

    - name: Push containers config
      ansible.builtin.template:
        src: "containers.conf"
        dest: "{{ dst_containers_dir }}"
        mode: "0644"

  always:
    - name: Remove staging directory
      ansible.builtin.file:
        path: "{{ quadlet_tmp_stage.path }}"
        state: absent
      delegate_to: localhost
      changed_when: false
