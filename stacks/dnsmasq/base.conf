# Port to listen on.
port=53

# Don't forward plain names (anything without a dot in it, "localhost" for example)
# to an upstream NS.
domain-needed

# Don't forward reverse DNS lookup for an IP in a private range to an upstream
# NS.
bogus-priv

# Ignore /etc/resolv.conf
# Try each server in reverse order (https://unix.stackexchange.com/a/697239) 
# Use Quad9 NS for missing entries.
no-resolv
strict-order
server=1.1.1.1
server=149.112.112.112
server=9.9.9.9

# Any dotless hostname in the /etc/hosts will be available at the specified domain,
# for example localhost.home.arpa
expand-hosts
domain=home.arpa

# Host-IP mappings.
# Note, you can just use `s1.home.arpa` without subdomain and it will act like a
# wildcard record.

# moon on local network
address=/s1.home.arpa/192.168.8.90
# moon on tailscale network
address=/s2.home.arpa/100.100.235.54

# omen services
address=/home.arpa/192.168.121.61
