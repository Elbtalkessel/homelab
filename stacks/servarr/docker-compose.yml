name: servarr
# Common configuration.
# If derivative has the same key it will OVERRIDE!
x-base: &a1
  restart: unless-stopped
  env_file: ./shared.env
  networks:
    - public
  extra_hosts:
    - host:172.17.0.1
services:
  lidarr:
    <<: *a1
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    volumes:
      - /share/Docker/Lidarr:/config
      - /share/Video/Music:/share/Video/Music
      - /share/Video/Downloads:/share/Video/Downloads
    healthcheck:
      test: "curl --fail http://localhost:8686 || exit 1"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
  overseerr:
    <<: *a1
    image: sctx/overseerr:latest
    container_name: overseerr
    user: ${UID:-1000}:${GID:-1000}
    environment:
      - PORT=5055
    volumes:
      - /share/Docker/Overseerr:/app/config
    restart: unless-stopped
    healthcheck:
      test: "wget http://localhost:5055/api/v1/status -qO /dev/null || exit 1"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
  prowlarr:
    <<: *a1
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - /share/Docker/Prowlarr:/config
    healthcheck:
      test: "curl --fail http://localhost:9696 || exit 1"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
  radarr:
    <<: *a1
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - /share/Docker/Radarr:/config
      - /share/Video/Movies:/share/Video/Movies
      - /share/Video/Downloads:/share/Video/Downloads
    healthcheck:
      test: "curl --fail http://localhost:7878 || exit 1"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
  sonarr:
    <<: *a1
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - /share/Docker/Sonarr:/config
      - /share/Video/TV Shows:/share/Video/TV Shows
      - /share/Video/Downloads:/share/Video/Downloads
    healthcheck:
      test: "curl --fail http://localhost:8989 || exit 1"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
  torrent:
    <<: *a1
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: torrent
    environment:
      - QBITTORRENT_VERSION=5.1.2
      - TP_COMMUNITY_THEME=true
      - TP_THEME=catppuccin-frappe
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:qbittorrent
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /share/Docker/QBitTorrent/appdata:/config
      - /share/Video/Downloads:/share/Video/Downloads
networks:
  public:
    external: true
x-dockge:
  urls:
    - https://lidarr.s1.home.arpa
    - https://overseerr.s1.home.arpa
    - https://prowlarr.s1.home.arpa
    - https://radarr.s1.home.arpa
    - https://sonarr.s1.home.arpa
    - https://torrent.s1.home.arpa
