name: immich
services:
  immich:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich
    restart: unless-stopped
    volumes:
      - /volume1/Docker/Immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-db
      - REDIS_HOSTNAME=immich-redis
    env_file: ./immich.env
    networks:
      - public
      - immich
    depends_on:
      - immich-redis
      - immich-db
    healthcheck:
      disable: false
    devices:
      - /dev/dri:/dev/dri
  immich-ml:
    container_name: immich-ml
    image: ghcr.io/immich-app/immich-machine-learning:release
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false
    networks:
      - immich
  immich-redis:
    image: docker.io/valkey/valkey:8-bookworm@sha256:fec42f399876eb6faf9e008570597741c87ff7662a54185593e74b09ce83d177
    container_name: immich-redis
    restart: unless-stopped
    env_file: ./immich.env
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - immich
  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-db
    restart: unless-stopped
    volumes:
      - /volume1/Docker/Immich/postgresql/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS="--data-checksums"
      - DB_STORAGE_TYPE=HDD
    env_file: ./immich.env
    networks:
      - immich
      - immich-database
volumes:
  model-cache: null
networks:
  immich: null
  public:
    external: true
  immich-database:
    external: true
x-dockge:
  urls:
    - https://photos.s1.home.arpa
    - https://photos.s2.home.arpa
