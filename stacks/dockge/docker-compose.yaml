name: dockge
services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/app/data
      # If you want to use private registries,
      # you need to share the auth file with Dockge:
      # - /root/.docker/:/root/.docker

      # Stacks Directory
      # ⚠️If you did it wrong, your data could end up writing into a WRONG PATH.
      # ⚠️FULL path only. No relative path (MUST)
      # ⚠️Left Stacks Path === Right Stacks Path (MUST)
      - /opt/stacks:/opt/stacks
    environment:
      # Tell Dockge where is your stacks directory
      - DOCKGE_STACKS_DIR=/opt/stacks
    networks:
      - public
    ports:
      # to manage docker files even if nginx and / or DNS is down
      - 8001:5001
volumes:
  data:
    driver: local
networks:
  public:
    external: true
x-dockge:
  urls:
    - https://docker.s1.home.arpa
