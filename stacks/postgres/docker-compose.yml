name: postgres
services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file: ./postgres.env
    volumes:
      - /share/Docker/PostgreSQL/latest:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - postgres
  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    volumes:
      - /share/Docker/Adminer/var/www/html/adminer.css:/var/www/html/adminer.css
    networks:
      - public
      - postgres
networks:
  public:
    external: true
  postgres:
    external: true
x-dockge:
  urls:
    - https://adminer.s1.home.arpa
