name: borg
services:
  borgmatic:
    image: ghcr.io/borgmatic-collective/borgmatic
    container_name: borgmatic
    hostname: moon
    environment:
      - TZ=Etc/UTC
      - BACKUP_CRON=0 0 * * *
      - DOCKERCLI=true
    env_file: ./borgmatic.env
    volumes:
      - /share:/mnt/share:ro
      - /volume1/.@plugins/AppCentral/docker-ce/docker_lib/volumes:/mnt/docker-volumes:ro
      - /share/USB4:/mnt/borg-repository
      - /mnt/borg/preview:/mnt/preview
      - ./data/borgmatic.d:/etc/borgmatic.d/
      - ./data/.config:/root/.config/borg
      - ./data/.ssh:/root/.ssh
      - ./data/.cache:/root/.cache/borg
    networks:
      - immich-database
      - postgres
      - borg
    restart: unless-stopped
networks:
  borg: null
  immich-database:
    external: true
  postgres:
    external: true
  public:
    external: true
