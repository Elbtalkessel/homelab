---
- Overview:
    - Network Usage:
        widget:
          type: glances
          version: 4
          url: http://host:61209
          username: {{HOMEPAGE_VAR_GLANCES_USERNAME}}
          password: {{HOMEPAGE_VAR_GLANCES_PASSWORD}}
          metric: network:eth1
    - Watchtower:
        widget:
          type: watchtower
          url: http://watchtower:8080
          key: {{HOMEPAGE_VAR_WATCHTOWER_KEY}}
    - Gitea:
        widget:
          type: gitea
          url: http://gitea:3000
          href: https://gitea.s1.home.arpa
          key: {{HOMEPAGE_VAR_GITEA_KEY}}
- Management:
    - Radarr:
        href: https://radarr.{{HOMEPAGE_VAR_ARR_BASE_URL}}/
        server: local
        container: radarr
        icon: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: {{HOMEPAGE_VAR_RADARR_API_KEY}}
    - Sonarr:
        href: https://sonarr.{{HOMEPAGE_VAR_ARR_BASE_URL}}/
        server: local
        container: sonarr
        icon: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: {{HOMEPAGE_VAR_SONARR_API_KEY}}
    - Lidarr:
        href: https://lidarr.{{HOMEPAGE_VAR_ARR_BASE_URL}}/
        server: local
        container: lidarr
        icon: lidarr
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: {{HOMEPAGE_VAR_LIDARR_API_KEY}}
    - Overseerr:
        href: https://overseerr.{{HOMEPAGE_VAR_ARR_BASE_URL}}/
        server: local
        container: overseerr
        icon: overseerr
        widget:
          type: overseerr
          url: http://overseerr:5055
          key: {{HOMEPAGE_VAR_OVERSEERR_API_KEY}}
- Downloads:
    - Prowlarr:
        href: https://prowlarr.{{HOMEPAGE_VAR_ARR_BASE_URL}}/
        server: local
        container: prowlarr
        icon: prowlarr
        widget:
          type: prowlarr
          fields:
            - numberOfGrabs
            - numberOfQueries
            - numberOfFailGrabs
          url: http://prowlarr:9696
          key: {{HOMEPAGE_VAR_PROWLARR_API_KEY}}
    - Qbittorrent:
        href: https://torrent.{{HOMEPAGE_VAR_ARR_BASE_URL}}/
        server: local
        container: torrent
        icon: qbittorrent
        widget:
          type: qbittorrent
          url: http://torrent:8080
          username: {{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}
          password: {{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}
- Media:
    - Plex:
        href: https://plex.{{HOMEPAGE_VAR_TLD}}/
        server: local
        container: plex
        icon: plex
        widget:
          type: plex
          fields:
            - movies
            - tv
            - albums
          url: http://host:32400
          key: {{HOMEPAGE_VAR_PLEX_API_KEY}}
    - Calibre:
        href: https://calibre.{{HOMEPAGE_VAR_TLD}}/
        server: local
        container: calibre
        icon: calibre-web
        widget:
          type: calibreweb
          fields:
            - books
            - categories
          url: http://calibre:8083
          username: {{HOMEPAGE_VAR_CALIBRE_USERNAME}}
          password: {{HOMEPAGE_VAR_CALIBRE_PASSWORD}}
    - Immich:
        href: https://photos.{{HOMEPAGE_VAR_TLD}}/
        server: local
        container: immich
        icon: immich
        widget:
          type: immich
          fields:
            - photos
          url: http://immich:2283
          key: {{HOMEPAGE_VAR_IMMICH_KEY}}
          version: 2
    - Stash:
        href: https://stash.{{HOMEPAGE_VAR_TLD}}/
        server: local
        container: stash
        icon: stash
        widget:
          type: stash
          fields:
            - scenes
            - images
            - performers
            - oCount
          url: http://stash:9999
          key: {{HOMEPAGE_VAR_STASH_KEY}}
