name: stash
services:
  stash:
    image: stashapp/stash:latest
    container_name: stash
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: 2m
    volumes:
      - /etc/localtime:/etc/localtime:ro
      ## Point this at your collection.
      - /volume1/Whatever:/data
      ## Keep configs, scrapers, and plugins here.
      - /volume1/Whatever/Stashapp/config:/root/.stash
      ## This is where your stash's metadata lives
      - /volume1/Whatever/Stashapp/metadata:/metadata
      ## Any other cache content.
      - /volume1/Whatever/Stashapp/cache:/cache
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - /volume1/Whatever/Stashapp/generated:/generated
    networks:
      - public
networks:
  public:
    external: true
x-dockge:
  urls:
    - https://stash.s1.home.arpa
