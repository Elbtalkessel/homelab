---
name: stash

services:
  stash:
    image: stashapp/stash:latest
    container_name: stash
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: 2m
    volumes:
      - /etc/localtime:/etc/localtime:ro
      ## Point this at your collection.
      - xyz:/data
      ## Keep configs, scrapers, and plugins here.
      - config:/root/.stash
      ## This is where your stash's metadata lives
      - metadata:/metadata
      ## Any other cache content.
      - cache:/cache
      ## Where to store generated content
      # (screenshots,previews,transcodes,sprites)
      - generated:/generated
    networks:
      - public

networks:
  public:
    external: true

volumes:
  xyz:
    external: true
  config:
  metadata:
  cache:
  generated:
