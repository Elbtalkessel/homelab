name: invidious
services:
  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: invidious
    restart: unless-stopped
    environment:
      # Please read the following file for a comprehensive list of all available
      # configuration options and their associated syntax:
      # https://github.com/iv-org/invidious/blob/master/config/config.example.yml
      INVIDIOUS_CONFIG: >
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: unforgiving
          port: 5432
        check_tables: true

        invidious_companion:

        # URL used for the internal communication between invidious and invidious companion

        # There is no need to change that except if Invidious companion does not run on the same docker compose file.
          - private_url: "http://odious:8282/companion"
        # IT is NOT recommended to use the same key as HMAC KEY. Generate a new key!

        # Use the key generated in the 2nd step

        invidious_companion_key: "ohngu1Xifahchiel"

        port: 3000

        external_port: 443

        domain: yt.s1.home.arpa

        https_only: true

        # statistics_enabled: false

        # Use the key generated in the 2nd step

        hmac_key: "ACh4Raet1hah0vuN"

        # Features

        captcha_enabled: false

        admins: ["risus"]

        enable_user_notifications: false
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/trending || exit
        1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options:
        max-size: 1G
        max-file: "4"
    depends_on:
      - unforgiving
    networks:
      - public
      - invidious
  odious:
    image: quay.io/invidious/invidious-companion:latest
    container_name: odious
    environment:
      # Use the key generated in the 2nd step
      - SERVER_SECRET_KEY=ohngu1Xifahchiel
    restart: unless-stopped
    # Uncomment only if you have configured "public_url" for Invidious companion
    # Or if you want to use Invidious companion as an API in your program.
    # Remove "127.0.0.1:" if used from an external IP
    #ports:
    #  - "127.0.0.1:8282:8282"
    logging:
      options:
        max-size: 1G
        max-file: "4"
    cap_drop:
      - ALL
    read_only: true
    # cache for youtube library
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true
    networks:
      - invidious
  unforgiving:
    image: docker.io/library/postgres:14
    container_name: unforgiving
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./data/config/sql:/config/sql:ro
      - ./data/docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
    networks:
      - invidious
volumes:
  postgresdata: null
  companioncache: null
networks:
  invidious: null
  public:
    external: true
