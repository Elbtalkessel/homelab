---
name: ca

services:
  step-ca:
    container_name: ca.x.home.arpa
    image: smallstep/step-ca
    environment:
      - DOCKER_STEPCA_INIT_NAME=Homelab
      - DOCKER_STEPCA_INIT_DNS_NAMES=ca.x.home.arpa
    env_file: ./.env
    networks:
      - public
    volumes:
      - home:/home/step
      - certs:/home/step/certs

networks:
  public:
    external: true

volumes:
  home:
  certs:
    external: true
