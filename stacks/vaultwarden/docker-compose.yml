name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vault
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.s1.home.arpa
    env_file: ./vaultwarden.env
    user: 1000:100
    volumes:
      - /share/Docker/Vault/:/data/
    networks:
      - public
networks:
  public:
    external: true
x-dockge:
  urls:
    - https://vault.s1.home.arpa
