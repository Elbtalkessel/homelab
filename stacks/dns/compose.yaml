---
name: dns

services:
  adguard:
    container_name: adguard
    image: adguard/adguardhome
    restart: unless-stopped
    volumes:
      - ag-work:/opt/adguardhome/work
      - ag-conf:/opt/adguardhome/conf
    ports:
      - 192.168.8.130:53:53/tcp
      - 192.168.8.130:53:53/udp
    networks:
      - public

volumes:
  ag-work:
  ag-conf:

networks:
  public:
    external: true
