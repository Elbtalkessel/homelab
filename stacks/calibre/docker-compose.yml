name: calibre
services:
  calibre:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre
    restart: unless-stopped
    volumes:
      - /share/Docker/Calibre/data:/config
      - /share/Calibre/books/main:/books
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    networks:
      - public
networks:
  public:
    external: true
x-dockge:
  urls:
    - https://calibre.s1.home.arpa
