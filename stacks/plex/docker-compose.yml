services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    restart: unless-stopped
    volumes:
      - /share/Plex/Library:/config
      - /share/Video:/share/Video
    environment:
      - PLEX_UID=1000
      - PLEX_GID=1000
      - TZ=Etc/UTC
      - VERSION=docker
    network_mode: host
networks: {}
x-dockge:
  urls:
    - https://plex.s1.home.arpa
