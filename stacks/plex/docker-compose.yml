---
name: plex

services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    restart: unless-stopped
    volumes:
      - plex-config:/config
      - media:/share/Video
    environment:
      - PLEX_UID=1000
      - PLEX_GID=1000
      - TZ=Etc/UTC
      - VERSION=docker
    network_mode: host

networks: {}

volumes:
  plex-config:
    external: true
  media:
    external: true
