---
api:
  insecure: false
  dashboard: false

log:
  level: WARN

providers:
  docker:
    exposedByDefault: false
    network: public
  file:
    directory: /etc/traefik/conf.d
    watch: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: stepca

experimental:
  fastProxy: {}
  plugins:
    sablier:
      modulename: github.com/sablierapp/sablier
      version: v1.10.1

certificatesResolvers:
  stepca:
    acme:
      caServer: "http://step-ca:9000/acme/acme/directory"
      email: "pieceof@duck.com"
      certificatesDuration: 2160
      httpChallenge:
        entryPoint: web
