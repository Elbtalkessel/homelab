api:
  insecure: false
  dashboard: false

log:
  level: WARN

providers:
  docker:
    exposedByDefault: false
    network: public
  file:
    directory: /etc/traefik/conf.d
    watch: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    # asDefault is not a direct config option, default is usually the first declared entryPoint

experimental:
  fastProxy: {}
  plugins:
    sablier:
      modulename: github.com/sablierapp/sablier
      version: v1.10.1
