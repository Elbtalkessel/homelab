---
http:
  services:
    plex:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://host.containers.internal:32400
    cockpit:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://host.containers.internal:9090

  routers:
    plex:
      rule: "Host(`plex.s2.home.arpa`)"
      entryPoints:
        - websecure
      service: plex
      tls: true
    cockpit:
      rule: "Host(`cockpit.s2.home.arpa`)"
      entryPoints:
        - websecure
      service: cockpit
      tls: true
