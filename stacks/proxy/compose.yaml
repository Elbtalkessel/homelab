---
name: proxy

services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    privileged: true
    command:
      - --configFile=/etc/traefik/traefik.yaml
    ports:
      - 80:80
      - 443:443
    volumes:
      - /run/user/1001/podman/podman.sock:/var/run/docker.sock:ro,z
      - ./conf.d:/etc/traefik/conf.d:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - certs:/certs:ro
    environment:
      - LEGO_CA_CERTIFICATES=/certs/root_ca.crt
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.x.home.arpa`) &&
        (PathPrefix(`/api`) || PathPrefix(`/dashboard`) ||
        PathPrefix(`/dashboard/`))
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.tls.certresolver=ca
      - traefik.http.routers.dashboard.middlewares=auth
      - traefik.http.middlewares.auth.basicauth.users=risus:$$apr1$$Qhuh9sKg$$bhKbVV.XLZ2Ycegt/3zeL1
    networks:
      - public

  sablier:
    container_name: sablier
    image: acouvreur/sablier:1.3.0
    privileged: true
    command:
      - start
      - --provider.name=docker
      - --sessions.expiration-interval=15m
      - --sessions.default-duration=1h
    volumes:
      - /run/user/1001/podman/podman.sock:/var/run/docker.sock:z
    networks:
      - public

networks:
  public:
    external: true

volumes:
  certs:
    external: true
